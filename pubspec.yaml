name: relateos
description: "RelateOS - Context-aware relationship intelligence platform for Hong Kong market"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Authentication & Backend
  supabase_flutter: ^2.8.0
  supabase: ^2.8.0
  
  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  
  # Storage & Security
  flutter_secure_storage: ^9.2.0
  
  # HTTP & Networking
  http: ^1.2.0
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # Platform Channels
  platform: ^3.1.0
  
  # UI & Design
  google_fonts: ^6.0.0
  
  # JSON serialization
  json_annotation: ^4.8.0
  
  # Encryption
  cryptography: ^2.1.0
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
  
  generate: true
